worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  keepalive_timeout  65;

  # Use Docker DNS resolver so nginx can resolve service names at runtime
  resolver 127.0.0.11 valid=10s; # Docker internal DNS

  upstream backend {
    # With docker-compose --scale app=N the service name "app" resolves to
    # multiple IPs; using a runtime resolver above plus variable-based
    # proxy_pass ensures nginx re-resolves backends periodically.
    server app:3000;
  }

  server {
    listen 80;
    server_name _;

    # Basic health endpoint proxying
    location /health {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://app:3000/health;
      proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    location / {
      # Ensure dynamic name resolution for scaled services
      set $upstream "http://app:3000";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Connection "";

      proxy_pass $upstream;
      proxy_next_upstream error timeout http_502 http_503 http_504;

      # Timeouts
      proxy_connect_timeout 5s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;

      # Buffering
      proxy_buffering on;
      proxy_buffers 16 4k;
    }

    # Optional: static file caching for assets (if served by nginx)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico)$ {
      expires 7d;
      add_header Cache-Control "public, must-revalidate";
      try_files $uri $uri/ =404;
    }
  }
}
